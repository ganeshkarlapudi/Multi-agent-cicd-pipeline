stages:
  - review
  - build
  - deploy
  - monitor

variables:
  AWS_REGION: ap-south-2
  ECR_REPO: agentops

# ---------- STAGE 1: PR Review Agent ----------
ai_review:
  stage: review
  image: python:3.11-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - pip install -r requirements.txt
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - git diff "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD" > diff.txt
    - flake8 agents/ || true
    - cd app && (npm test || true) && cd ..
    - python agents/pr_review_agent.py --diff diff.txt --mr "$CI_MERGE_REQUEST_IID"

# ---------- STAGE 2: Build & Push Docker Image ----------
build_image:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - apk upgrade --no-cache
    - apk add --no-cache aws-cli
  script:
    # Assume AWS role via OIDC
    - echo "$AWS_OIDC_TOKEN" > /tmp/web_identity_token
    - export AWS_ROLE_ARN="$DEPLOY_ROLE_ARN"
    - export AWS_WEB_IDENTITY_TOKEN_FILE="/tmp/web_identity_token"
    # Login to ECR, build & push
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
    - docker build -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$CI_COMMIT_SHORT_SHA ./app
    - docker tag $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$CI_COMMIT_SHORT_SHA $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:latest
    - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$CI_COMMIT_SHORT_SHA
    - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:latest

# ---------- STAGE 3: Deploy Agent ----------
deploy:
  stage: deploy
  image: hashicorp/terraform:1.9
  needs: ["build_image"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: production      # protected environment -> requires manual approval
    action: start
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - apk upgrade --no-cache
    - apk add --no-cache aws-cli kubectl python3 py3-pip
  script:
    - echo "$AWS_OIDC_TOKEN" > /tmp/web_identity_token
    - export AWS_ROLE_ARN="$DEPLOY_ROLE_ARN"
    - export AWS_WEB_IDENTITY_TOKEN_FILE="/tmp/web_identity_token"
    - python3 agents/deploy_agent.py

# ---------- STAGE 4: Monitor & Rollback Agent ----------
monitor_rollback:
  stage: monitor
  image: python:3.11-slim
  needs: ["deploy"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - apt-get update && apt-get install -y awscli || true  # Using python:3.11-slim which is debian based
    - pip install boto3
  script:
    - echo "$AWS_OIDC_TOKEN" > /tmp/web_identity_token
    - export AWS_ROLE_ARN="$MONITOR_ROLE_ARN"
    - export AWS_WEB_IDENTITY_TOKEN_FILE="/tmp/web_identity_token"
    - python agents/monitor_agent.py
