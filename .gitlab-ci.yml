stages:
  - review
  - build
  - deploy
  - monitor

variables:
  AWS_REGION: ap-south-2
  ECR_REPO: AgentOps

# ---------- STAGE 1: PR Review Agent ----------
ai_review:
  stage: review
  image: python:3.11-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - pip install -r requirements.txt
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - git diff "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD" > diff.txt
    - flake8 agents/ || true
    - npm test || true
    - python agents/pr_review_agent.py --diff diff.txt --mr "$CI_MERGE_REQUEST_IID"

# ---------- STAGE 2: Build & Push Docker Image ----------
build_image:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - apk add --no-cache aws-cli python3
  script:
    # Assume AWS role via OIDC
    - >
      export $(python3 -c "
      import json, subprocess, os
      r = subprocess.run(['aws','sts','assume-role-with-web-identity',
        '--role-arn', os.environ['DEPLOY_ROLE_ARN'],
        '--role-session-name','gitlab-build',
        '--web-identity-token', os.environ['AWS_OIDC_TOKEN'],
        '--output','json'], capture_output=True, text=True)
      c = json.loads(r.stdout)['Credentials']
      print(f'AWS_ACCESS_KEY_ID={c[\"AccessKeyId\"]}')
      print(f'AWS_SECRET_ACCESS_KEY={c[\"SecretAccessKey\"]}')
      print(f'AWS_SESSION_TOKEN={c[\"SessionToken\"]}')
      ")
    # Login to ECR, build & push
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
    - docker build -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$CI_COMMIT_SHORT_SHA .
    - docker tag $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$CI_COMMIT_SHORT_SHA $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:latest
    - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$CI_COMMIT_SHORT_SHA
    - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:latest

# ---------- STAGE 3: Deploy Agent ----------
deploy:
  stage: deploy
  image: hashicorp/terraform:1.9
  needs: ["build_image"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  environment:
    name: production      # protected environment -> requires manual approval
    action: start
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - apk add --no-cache aws-cli kubectl python3 py3-pip
  script:
    - python3 agents/deploy_agent.py

# ---------- STAGE 4: Monitor & Rollback Agent ----------
monitor_rollback:
  stage: monitor
  image: python:3.11-slim
  needs: ["deploy"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - pip install boto3
  script:
    - python agents/monitor_agent.py
