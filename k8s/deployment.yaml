apiVersion: apps/v1
kind: Deployment
metadata:
  name: AgentOps
  labels:
    app: AgentOps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: AgentOps
  template:
    metadata:
      labels:
        app: AgentOps
    spec:
      containers:
        - name: AgentOps
          image: PLACEHOLDER_ECR_IMAGE   # Replaced by deploy_agent.py at deploy time
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: METRICS_ENABLED
              value: "true"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: AgentOps-db-credentials
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: AgentOps-db-credentials
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: AgentOps-db-credentials
                  key: dbname
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: AgentOps-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: AgentOps-db-credentials
                  key: password
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: AgentOps-app-secrets
                  key: session-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
