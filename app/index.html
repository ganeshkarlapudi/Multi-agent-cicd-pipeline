<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Student Registration System - Modern platform for student management and AI tools">
  <title>Student Portal - Welcome</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.4/gsap.min.js"></script>
</head>
<body>
  <!-- Preloader -->
  <div class="preloader">
    <div class="preloader-content">
      <div class="preloader-logo">StudentHub</div>
      <div class="progress-container">
        <div class="progress-bar"></div>
      </div>
      <div class="loading-text">Loading Experience...</div>
    </div>
  </div>

  <!-- Landing Page -->
  <div class="landing-page" style="opacity: 0;">
    <!-- Spline 3D Background -->
    <div class="landing-hero">
      <div class="spline-container">
        <iframe src='https://my.spline.design/r4xbot-LLJu4duWVtKxk4zQCEjC5jXf/' frameborder='0' width='100%' height='100%'></iframe>
      </div>
      
      <!-- Hero Content -->
      <div class="hero-content">
        <h1 class="hero-title">Welcome to StudentHub</h1>
        <p class="hero-description">
          Your gateway to modern education and cutting-edge AI tools. 
          Register now to explore a curated collection of AI resources.
        </p>
        <div class="hero-buttons">
          <a href="register.html" class="btn btn-primary">Get Started</a>
          <a href="login.html" class="btn btn-secondary">Sign In</a>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="app.js"></script>
</body>
</html>
