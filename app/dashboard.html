<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Tools Dashboard - Explore curated AI tools for students">
    <title>Dashboard - StudentHub</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.4/gsap.min.js"></script>
</head>

<body>
    <div class="dashboard">
        <div class="container">
            <!-- Dashboard Header -->
            <div class="dashboard-header">
                <div>
                    <h1 class="dashboard-title">AI Tools Hub</h1>
                    <p style="color: var(--text-secondary);">Explore cutting-edge AI tools for your studies</p>
                </div>
                <div class="dashboard-controls">
                    <div class="search-box">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchInput" class="search-input" placeholder="Search tools...">
                    </div>
                    <button onclick="window.location.href='/chatbot'" class="btn btn-primary"
                        style="margin-right: 1rem;">
                        💬 AI Chat
                    </button>
                    <button id="logoutBtn" class="btn btn-secondary">Logout</button>
                </div>
            </div>

            <!-- Filter Buttons -->
            <div class="filter-buttons mb-3">
                <button class="filter-btn active" data-category="all">All Tools</button>
                <button class="filter-btn" data-category="content">Content Creation</button>
                <button class="filter-btn" data-category="development">Development</button>
                <button class="filter-btn" data-category="design">Design</button>
                <button class="filter-btn" data-category="research">Research</button>
                <button class="filter-btn" data-category="productivity">Productivity</button>
                <button class="filter-btn" data-category="data">Data Analysis</button>
            </div>

            <!-- Tools Grid -->
            <div class="tools-grid" id="toolsGrid">
                <!-- Tools will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="app.js"></script>
</body>

</html>
